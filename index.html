<style>
/* Layout: guida a passi su una colonna. Testata con marchio e avanzamento fissa in alto, risposte fisse in basso. */
:root {
  --navy: #0F2B46; --teal: #0E9594; --logo-ink: #ffffff;
  --bg: #eef1f4; --panel: #ffffff; --ink: #16222e; --muted: #586877; --line: #d3dbe3;
  --primary: #0F2B46; --primary-ink: #ffffff; --accent: #0a7372; --soft: #e2ecee;
  --ok: #1d7146; --ok-bg: #e1f2e8; --warn: #855600; --warn-bg: #fbf0d9; --bad: #a8261d; --bad-bg: #fbe3e0;
  --water: #cfe0f3; --steel: #7d8a97; --wa: #1b7f45; --wa-ink: #ffffff;
  --f-body: "Barlow", "Segoe UI", Roboto, Arial, sans-serif;
  --f-head: "Barlow Semi Condensed", "Barlow", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1319; --panel: #17202a; --ink: #e6ebf0; --muted: #9aa8b5; --line: #2b3947;
  --primary: #3fc1bf; --primary-ink: #04211f; --accent: #5fd3d1; --soft: #1c2c33;
  --ok: #6cc596; --ok-bg: #16301f; --warn: #e4b04f; --warn-bg: #33270e; --bad: #f28a80; --bad-bg: #3a1916;
  --water: #1f3550; --steel: #8996a3; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1319; --panel: #17202a; --ink: #e6ebf0; --muted: #9aa8b5; --line: #2b3947;
  --primary: #3fc1bf; --primary-ink: #04211f; --accent: #5fd3d1; --soft: #1c2c33;
  --ok: #6cc596; --ok-bg: #16301f; --warn: #e4b04f; --warn-bg: #33270e; --bad: #f28a80; --bad-bg: #3a1916;
  --water: #1f3550; --steel: #8996a3; color-scheme: dark; }

* { box-sizing: border-box; }
html { height: 100%; }
body { min-height: 100%; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.wrap { width: 100%; max-width: 600px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font-family: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.top { display: flex; align-items: center; gap: 12px; padding-block: 10px 9px; }
.logo { flex: none; width: 38px; height: 38px; margin-bottom: 4px; background: var(--navy); color: var(--logo-ink); display: grid; place-items: center; font: 700 15px Arial, Helvetica, sans-serif; letter-spacing: 1px; box-shadow: 0 4px 0 var(--teal); }
.who { flex: 1; min-width: 0; }
.who b { display: block; font: 700 18px/1.1 var(--f-head); }
.who span { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbtn { flex: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 500 14px var(--f-body); padding: 8px 12px; border-radius: 8px; cursor: pointer; }
.prog { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 0 4px; min-height: 30px; }
#stato { font: 700 12.5px var(--f-head); letter-spacing: .9px; text-transform: uppercase; color: var(--accent); }
.back { border: 0; background: none; color: var(--muted); font: 500 14px var(--f-body); padding: 4px 0 4px 10px; cursor: pointer; }
.back:disabled { opacity: .35; }
.bar { height: 3px; background: var(--line); }
.bar i { display: block; height: 100%; width: 0; background: var(--teal); transition: width .25s ease-out; }

main { flex: 1; }
main .wrap { display: flex; flex-direction: column; gap: 10px; padding-block: 14px 24px; }
.sec { display: flex; align-items: baseline; gap: 10px; margin-top: 8px; padding-bottom: 5px; border-bottom: 1px solid var(--line); }
.sec:first-child { margin-top: 0; }
.sec b { font: 700 21px/1.1 var(--f-head); }
.sec span { font-size: 14px; color: var(--muted); }
.q { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; overflow-wrap: anywhere; }
.cat { font: 700 12.5px var(--f-head); letter-spacing: .9px; text-transform: uppercase; color: var(--accent); }
.q figure { margin: 0; }
.q img { display: block; width: 100%; height: auto; border-radius: 8px; }
.q figure.sch { align-self: center; width: 100%; max-width: 330px; }
.q svg { display: block; width: 100%; height: auto; }
.q table { border-collapse: collapse; margin-top: 4px; font-variant-numeric: tabular-nums; font-size: 15px; }
.q td { padding: 2px 14px 2px 0; } .q td.n { text-align: right; }
.q a { color: var(--accent); }
.q a.doc { display: block; border: 1.5px solid var(--accent); border-radius: 10px; padding: 10px 12px; font-weight: 600; text-decoration: none; }
.q a.doc small { display: block; font-weight: 400; font-size: 13.5px; color: var(--muted); }
.a { align-self: flex-end; max-width: 85%; background: var(--primary); color: var(--primary-ink); font-weight: 600; padding: 8px 14px; border-radius: 8px; overflow-wrap: anywhere; }
.a.skip { background: var(--soft); color: var(--ink); font-weight: 400; }
.fb { border-radius: 10px; padding: 10px 14px; }
.fb .tag { display: block; font: 700 12.5px var(--f-head); letter-spacing: .9px; text-transform: uppercase; margin-bottom: 2px; }
.fb.ok { background: var(--ok-bg); } .fb.ok .tag { color: var(--ok); }
.fb.warn { background: var(--warn-bg); } .fb.warn .tag { color: var(--warn); }
.fb.bad { background: var(--bad-bg); } .fb.bad .tag { color: var(--bad); }

.cover { display: flex; flex-direction: column; gap: 14px; padding-top: 6px; }
.cover h1 { margin: 0; font: 700 28px/1.12 var(--f-head); text-wrap: balance; }
.cover .lead { margin: 0; font-size: 17px; color: var(--muted); }
.cover ol, .cover ul { margin: 0; padding-left: 20px; }
.cover li { margin: 4px 0; }
.cover .legal { font-size: 13px; color: var(--muted); }

footer { position: sticky; bottom: 0; z-index: 5; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
footer .wrap { padding-block: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.opts { display: grid; gap: 8px; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); }
.opt { border: 1.5px solid var(--primary); background: var(--panel); color: var(--primary); font: 600 16px/1.2 var(--f-body); padding: 10px 12px; border-radius: 10px; min-height: 50px; cursor: pointer; }
.opt.ghost { border-color: var(--line); color: var(--muted); font-weight: 500; }
.opt.solid { background: var(--primary); color: var(--primary-ink); }
.row { display: flex; gap: 8px; align-items: stretch; }
.row input, .row textarea { flex: 1; min-width: 0; font: 400 17px var(--f-body); color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 12px; }
.row textarea { resize: none; min-height: 50px; }
.row .unit { align-self: center; color: var(--muted); }
.send { flex: none; border: 0; background: var(--primary); color: var(--primary-ink); font: 600 16px var(--f-body); padding: 0 20px; border-radius: 10px; cursor: pointer; min-height: 50px; }
.err { font-size: 14px; color: var(--bad); }
.hint { font-size: 13.5px; color: var(--muted); }
.big { display: block; text-align: center; text-decoration: none; background: var(--wa); color: var(--wa-ink); font: 700 17px var(--f-body); padding: 15px; border-radius: 10px; }

.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet .wrap { padding-block: 16px 28px; display: flex; flex-direction: column; gap: 12px; }
.sheet h2 { font: 700 23px var(--f-head); margin: 0; flex: 1; }
.sheet pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: 400 15px/1.45 var(--f-body); margin: 0; font-variant-numeric: tabular-nums; }
.sheet .acts { display: flex; flex-wrap: wrap; gap: 8px; }
@media (prefers-reduced-motion: no-preference) { .new { animation: in .18s ease-out; } @keyframes in { from { transform: translateY(6px); opacity: .3; } } }
</style>

const SKIP = "__skip";

function verdetto(p) {
  const dn = get(`p${p}.tubo`), mo = get(`p${p}.monte`), va = get(`p${p}.valle`);
  if (!RETT[dn] || (typeof mo !== "number" && typeof va !== "number")) return null;
  const t = RETT[dn], min = [t[0], t[1]], meglio = [t[2], t[3]];
  const pv = ["pompa", "valvola"].includes(get(`p${p}.monteCosa`));
  const rif = `Per il DN ${dn}, il minimo è ${m(min[0])} m a monte e ${m(min[1])} a valle; meglio ${m(meglio[0])} e ${m(meglio[1])}.`;
  const okMo = typeof mo !== "number" ? null : mo >= meglio[0] ? 2 : mo >= min[0] ? 1 : 0;
  const okVa = typeof va !== "number" ? null : va >= meglio[1] ? 2 : va >= min[1] ? 1 : 0;
  const v = [okMo, okVa].filter(x => x !== null), peggio = Math.min(...v);
  if (peggio === 0) return { tone: "bad", tag: "Tratto corto", txt: `${rif} Qui siamo sotto il minimo. Se sullo stesso tubo trovi un tratto più lungo, segnalo come punto in più. Altrimenti lo valutiamo con Siemens.`, breve: "sotto il minimo" };
  if (peggio === 1) return { tone: pv ? "warn" : "ok", tag: pv ? "Al limite" : "Va bene", txt: pv ? `${rif} Qui siamo al minimo. Con una pompa o una valvola a monte conviene cercare più distanza, se il tubo lo permette.` : `${rif} Il minimo c'è.`, breve: pv ? "nel minimo, ma dopo pompa o valvola" : "nel minimo" };
  return { tone: "ok", tag: "Ottimo", txt: `${rif} Siamo sopra: per i rettilinei il punto va bene.`, breve: "ottimo" };
}

  { id: "pieno", cat: "Posizione del tubo", say: () => ["Lì il tubo è <b>sempre pieno</b>, anche a pompe ferme? Evitiamo i punti alti dove si ferma l'aria."], in: CH({ v: "si", l: "Sì, sempre pieno" }, { v: "alto", l: "È un punto alto" }, { v: "nonso", l: "Non so" }) },
  { id: "coib", cat: "Coibentazione", img: "coibentazione", say: () => ["Il tubo è <b>coibentato</b>? Per montare i sensori va aperto un tratto."], in: CH({ v: "no", l: "No, è nudo" }, { v: "facile", l: "Sì, si apre facile" }, { v: "difficile", l: "Sì, difficile da aprire" }) },
  { id: "v2", cat: "Video 2 di 3 · il giro attorno al tubo", svgs: [MONTAGGIO, SEZIONE],
    prima: () => ["Fai un giro attorno al tubo nel punto scelto. Ogni coppia di sensori sta in due telai, uniti da una barra e fissati con fascette inox, sui <b>fianchi alti</b> del tubo."],
    say: () => ["Guarda se lì trovi staffe, parete, altri tubi o la saldatura lunga del tubo, così capiamo se c'è spazio.",
      `<a class="doc" href="https://cache.industry.siemens.com/dl/files/583/109749583/att_927488/v1/FSS200_IM_en_en-US.pdf#page=32" target="_blank" rel="noopener">Apri i disegni di montaggio Siemens<small>Manuale dei sensori FSS200, pagine 30-32 (PDF in inglese)</small></a>`],
    in: CH({ v: "libero", l: "Fatto, spazio libero" }, { v: "ingombro", l: "Fatto, c'è un ingombro" }, { v: "dopo", l: "Lo faccio dopo", c: "ghost" }) },
  { id: "trasm", cat: "Trasmettitore", say: () => ["Quanti metri hai dal punto scelto alla <b>parete del trasmettitore</b>?"], in: NUM("m") },
  { info: true, when: p => typeof get(`p${p}.trasm`) === "number", say: p => { const t = get(`p${p}.trasm`);
      if (t <= 10) return [{ tone: "ok", html: `<span class="tag">Va bene</span>Qui bastano i cavi da 10 m.` }];
      if (t <= 20) return [{ tone: "warn", html: `<span class="tag">Cavi da 20 m</span>Servono quelli lunghi: ci sono in opzione.` }];
      return [{ tone: "bad", html: `<span class="tag">Troppo lontano</span>Siamo oltre 20 m. Se c'è una parete più vicina, meglio quella.` }]; } },
  { id: "v3", cat: "Video 3 di 3 · verso la parete", say: () => ["Vai dal tubo alla parete e riprendi il percorso dei cavi e la presa."], in: CH({ v: "si", l: "Fatto" }, { v: "dopo", l: "Lo faccio dopo", c: "ghost" }) },
  { id: "note", cat: "Note", say: () => ["C'è altro da segnalare su questo punto?"], in: TXT("Scrivi qui", "Niente") },
  { id: "next", say: p => [`Punto ${p} fatto. Ne hai un altro?`], in: CH({ v: "altro", l: "Sì, un altro punto", c: "solid" }, { v: "fine", l: "No, ho finito i punti" }) },
];

const FINE = [
  { id: "g.sup", cat: "Supervisione", say: () => ["Indica la marca del PLC o del software di supervisione e se c'è una porta RS485 libera. Se riesci, fai anche una foto del quadro aperto."], in: TXT("Ad esempio: Siemens S7-1200, RS485 libera", "Non so") },
  { id: "g.chi", cat: "Montaggio", say: () => ["Chi monterebbe i sensori?"], in: CH({ v: "loro", l: "Il nostro installatore" }, { v: "noi", l: "Chiediamo a voi" }, { v: "dadecidere", l: "Da decidere" }) },
  { id: "g.quando", cat: "Montaggio", say: () => ["In che periodo pensavi di montarli, più o meno?"], in: TXT("Ad esempio: entro gennaio", "Da decidere") },
  { id: "g.extra", say: () => ["Il necessario c'è, grazie. Se hai ancora cinque minuti ci sono tre misure extra: non servono per l'offerta, aiutano dopo."], in: CH({ v: "si", l: "Vediamo gli extra" }, { v: "no", l: "Basta così", c: "solid" }) },
  { id: "x.circ", cat: "Extra 1 di 3 · circonferenza", when: () => get("g.extra") === "si", img: "circonferenza",
    say: () => ["Circonferenza del tubo nudo, misurata con il metro a nastro, in mm. Scrivi punto e valore, per esempio <i>P1 688</i>.",
      `Valori attesi:<table><tr><td>DN 150</td><td class="n">529 mm</td></tr><tr><td>DN 200</td><td class="n">688 mm</td></tr><tr><td>DN 250</td><td class="n">858 mm</td></tr><tr><td>DN 300</td><td class="n">1.018 mm</td></tr></table>`],
    in: TXT("P1 688, P2 ...", "Salto") },
  { id: "x.sp", cat: "Extra 2 di 3 · spessore", when: () => get("g.extra") === "si", img: "spessore",
    say: () => ["C'è uno spessimetro a ultrasuoni in centrale? Sul DN 200 e sul DN 250 lo spessore serve per scegliere la taglia dei sensori."],
    in: CH({ v: "si", l: "Sì, c'è" }, { v: "no", l: "No" }) },
  { id: "x.spv", cat: "Extra 2 di 3 · spessore", when: () => get("g.extra") === "si" && get("x.sp") === "si",
    say: () => ["Per ogni punto, fai tre o quattro letture attorno al tubo. Scrivile così, per esempio: <i>P1 6,2 6,4 6,3</i>."], in: TXT("P1 ...", "Salto") },
  { id: "x.marc", cat: "Extra 3 di 3 · marcatura", when: () => get("g.extra") === "si",
    say: () => ["Se sul tubo trovi una marcatura stampata (norma, spessore), fanne una foto. Va bene anche la specifica dei tubi dal progetto."],
    in: CH({ v: "foto", l: "Foto fatta" }, { v: "progetto", l: "La chiedo al progetto" }, { v: "no", l: "Non c'è" }) },
];

const INTRO = { id: "intro" };

function piano() {
  const seq = [];
  const add = (st, k, p) => { if (st.when && !st.when(p)) return true; seq.push({ st, k, p }); return st.info || get(k) !== undefined; };
  if (!add(INTRO, "intro")) return seq;
  for (let p = 1; p < 30; p++) {
    for (const st of PUNTO) if (!add(st, st.info ? null : `p${p}.${st.id}`, p)) return seq;
    if (get(`p${p}.next`) !== "altro") break;
  }
  for (const st of FINE) if (!add(st, st.id)) return seq;
  seq.push({ fine: true });
  return seq;
}

const el = (cls, html) => { const d = document.createElement("div"); d.className = cls; d.innerHTML = html; return d; };

function scheda(s, conCat) {
  const par = a => a.map(t => `<div>${t}</div>`).join("");
  const fig = (s.st.img && IMG[s.st.img] ? `<figure><img src="${IMG[s.st.img]}" alt="${ALT[s.st.img] || ""}"></figure>` : "") + (s.st.svgs || []).map(x => `<figure class="sch">${x}</figure>`).join("");
  const corpo = s.st.prima ? par(s.st.prima(s.p)) + fig + par(s.st.say(s.p)) : par(s.st.say(s.p)) + fig;
  return el("q", (conCat ? `<span class="cat">${s.st.cat}</span>` : "") + corpo);
}

function sezione(s) {
  if (s.p) { const t = lab(`p${s.p}.tubo`), l = get(`p${s.p}.linea`);
    return [`Punto ${s.p}`, t ? t + (l && l !== "nonso" ? " · " + lab(`p${s.p}.linea`).toLowerCase() : "") : ""]; }
  return [s.k.startsWith("x.") ? "Misure extra" : "Dati generali", ""];
}

function avanzamento(seq) {
  const u = seq[seq.length - 1];
  if (u.fine) return ["Completato", 1];
  if (u.p) { const qs = PUNTO.filter(x => !x.info), i = qs.indexOf(u.st); return [`Punto ${u.p} · passo ${i + 1} di ${qs.length}`, i / qs.length]; }
  const qs = FINE.filter(x => !x.when || x.when()), i = qs.indexOf(u.st);
  return [`${u.k.startsWith("x.") ? "Misure extra" : "Dati generali"} · passo ${i + 1} di ${qs.length}`, i / qs.length];
}

let ultimo = 0;
function disegna() {
  const chat = document.getElementById("chat"), tasti = document.getElementById("tasti");
  chat.innerHTML = ""; tasti.innerHTML = "";
  const copertina = get("intro") === undefined;
  document.getElementById("prog").hidden = copertina;
  document.getElementById("apri").hidden = copertina;
  if (copertina) {
    chat.innerHTML = COVER;
    const b = document.createElement("button"); b.type = "button"; b.className = "opt solid"; b.textContent = "Inizia il sopralluogo";
    b.onclick = () => metti("intro", "via", "Iniziamo");
    const box = document.createElement("div"); box.className = "opts"; box.style.setProperty("--cols", 1); box.appendChild(b); tasti.appendChild(box);
    document.getElementById("barra").style.width = "0";
    ultimo = 0; window.scrollTo({ top: 0 });
    return;
  }
  const seq = piano();
  let sez = null, cat = null;
  for (const s of seq) {
    if (s.fine) {
      const n = ans.filter(a => /^p\d+\.tubo$/.test(a.k)).length;
      chat.appendChild(el("fb ok", `<span class="tag">Sopralluogo completato</span>${n === 1 ? "Un punto registrato" : n + " punti registrati"}. Con il tasto qui sotto invii il riepilogo su WhatsApp a Roberto Alberio, Nortek Hendriks.`));
      chat.appendChild(el("q", "<div>Se non c'è campo, resta tutto salvato e lo invii appena esci. Con Indietro puoi ancora correggere.</div>"));
      tasti.innerHTML = `<a class="big" href="${linkWa()}" target="_blank" rel="noopener">Invia il riepilogo su WhatsApp</a><div class="opts" style="--cols:1"><button class="opt ghost" type="button" id="vedi">Vedi il riepilogo</button></div>`;
      document.getElementById("vedi").onclick = apriFoglio;
      break;
    }
    if (s.st === INTRO) continue;
    if (!s.st.info) {
      const [nome, info] = sezione(s);
      if (nome !== sez) { sez = nome; cat = null; chat.appendChild(el("sec", `<b>${nome}</b><span>${esc(info)}</span>`)); }
    }
    if (s.st.info) { for (const f of s.st.say(s.p)) chat.appendChild(el("fb " + f.tone, f.html)); continue; }
    chat.appendChild(scheda(s, s.st.cat && s.st.cat !== cat));
    cat = s.st.cat || null;
    const v = get(s.k);
    if (v !== undefined) { chat.appendChild(el("a" + (v === SKIP ? " skip" : ""), esc(lab(s.k)))); continue; }
    rispondi(s, tasti);
  }
  const [stato, fr] = avanzamento(seq);
  document.getElementById("stato").textContent = stato;
  document.getElementById("barra").style.width = Math.round(fr * 100) + "%";
  const nuove = chat.children;
  for (let i = ultimo; i < nuove.length; i++) nuove[i].classList.add("new");
  ultimo = nuove.length;
  requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight }));
}

function metti(k, v, l) { ans = ans.filter(x => x.k !== k); ans.push({ k, v, l }); salva(); disegna(); }

function rispondi(s, tasti) {
  const i = s.st.in;
  if (i.t === "chips") {
    const box = document.createElement("div"); box.className = "opts";
    const lungo = Math.max(...i.o.map(o => o.l.length));
    box.style.setProperty("--cols", lungo <= 9 && i.o.length > 2 ? 3 : lungo <= 17 ? 2 : 1);
    for (const o of i.o) {
      const b = document.createElement("button"); b.type = "button"; b.className = "opt" + (o.c ? " " + o.c : ""); b.textContent = o.l;
      b.onclick = () => metti(s.k, o.v, o.l); box.appendChild(b);
    }
    tasti.appendChild(box);
    return;
  }
  const row = document.createElement("div"); row.className = "row";
  const inp = document.createElement(i.t === "num" ? "input" : "textarea");
  inp.id = "in-" + s.k.replace(/\W/g, "-");
  inp.setAttribute("aria-label", i.t === "num" ? "Metri" : "Risposta");
  if (i.t === "num") { inp.inputMode = "decimal"; inp.placeholder = "es. 2,5"; inp.autocomplete = "off"; }
  else { inp.placeholder = i.ph; inp.rows = 1; }
  const err = document.createElement("div"); err.className = "err"; err.hidden = true;
  const invia = () => {
    const raw = inp.value.trim();
    if (!raw) { err.textContent = (i.t === "num" ? "Scrivi i metri" : "Scrivi una risposta") + ", oppure tocca “" + i.skip + "”."; err.hidden = false; return; }
    if (i.t === "num") {
      const n = parseFloat(raw.replace(",", "."));
      if (!(n >= 0 && n < 500)) { err.textContent = "Serve un numero in metri, ad esempio 2,5."; err.hidden = false; return; }
      metti(s.k, n, m(n) + " " + i.unit);
    } else metti(s.k, raw, raw);
  };
  inp.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); invia(); } };
  row.appendChild(inp);
  if (i.t === "num") row.appendChild(Object.assign(document.createElement("span"), { className: "unit", textContent: i.unit }));
  const b = document.createElement("button"); b.type = "button"; b.className = "send"; b.textContent = "Avanti"; b.onclick = invia; row.appendChild(b);
  tasti.appendChild(row); tasti.appendChild(err);
  const box = document.createElement("div"); box.className = "opts"; box.style.setProperty("--cols", 1);
  const sk = document.createElement("button"); sk.type = "button"; sk.className = "opt ghost"; sk.textContent = i.skip; sk.onclick = () => metti(s.k, SKIP, i.skip);
  box.appendChild(sk); tasti.appendChild(box);
}

function testo() {
  const L = [], val = k => { const v = get(k); return v === undefined ? "-" : v === SKIP ? lab(k).toLowerCase() : lab(k); };
  L.push("SOPRALLUOGO CLAMP-ON, " + new Date().toLocaleDateString("it-IT"));
  for (let p = 1; p < 30; p++) {
    if (get(`p${p}.tubo`) === undefined) break;
    L.push("", `PUNTO ${p}: ${val(`p${p}.tubo`)}, ${val(`p${p}.linea`).toLowerCase()}`);
    const vd = verdetto(p);
    L.push(`Rettilinei: monte ${val(`p${p}.monte`)} (${val(`p${p}.monteCosa`).toLowerCase()}), valle ${val(`p${p}.valle`)} (${val(`p${p}.valleCosa`).toLowerCase()})${vd ? ", " + vd.breve : ""}`);
    L.push(`Tubo: ${val(`p${p}.posiz`).toLowerCase()}; pieno: ${val(`p${p}.pieno`).toLowerCase()}`);
    L.push(`Coibentazione: ${val(`p${p}.coib`).toLowerCase()}; fianchi alti: ${val(`p${p}.v2`).toLowerCase()}`);
    L.push(`Trasmettitore: ${val(`p${p}.trasm`)}`);
    const vid = ["v1", "v2", "v3"].map((v, i) => `${i + 1} ${get(`p${p}.${v}`) === undefined ? "-" : get(`p${p}.${v}`) === "dopo" ? "da fare" : "fatto"}`).join(", ");
    L.push(`Video: ${vid}`);
    if (get(`p${p}.note`) !== undefined && get(`p${p}.note`) !== SKIP) L.push(`Note: ${get(`p${p}.note`)}`);
  }
  if (get("g.sup") !== undefined) L.push("", `Supervisione: ${val("g.sup")}`, `Chi monta: ${val("g.chi").toLowerCase()}`, `Quando: ${val("g.quando")}`);
  if (get("g.extra") === "si") L.push("", `Circonferenze: ${val("x.circ")}`, `Spessimetro: ${val("x.sp").toLowerCase()}${get("x.sp") === "si" ? ", letture: " + val("x.spv") : ""}`, `Marcatura tubo: ${val("x.marc").toLowerCase()}`);
  return L.join("\n");
}
const linkWa = () => `https://wa.me/${TEL}?text=${encodeURIComponent(testo())}`;

function apriFoglio() {
  document.getElementById("testo").textContent = testo();
  document.getElementById("wa").href = linkWa();
  document.getElementById("foglio").hidden = false;
}
document.getElementById("apri").onclick = apriFoglio;
document.getElementById("chiudi").onclick = () => { document.getElementById("foglio").hidden = true; disegna(); };
document.getElementById("indietro").onclick = () => { ans.pop(); salva(); ultimo = 0; disegna(); };
document.getElementById("copia").onclick = e => {
  const t = testo(), btn = e.currentTarget;
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("testo")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Testo selezionato: copialo"; };
  try { navigator.clipboard.writeText(t).then(() => { btn.textContent = "Copiato"; }, fallback); } catch (err) { fallback(); }
};
let conferma = false;
document.getElementById("azzera").onclick = e => {
  if (!conferma) { conferma = true; e.currentTarget.textContent = "Sicuro? Tocca ancora per cancellare tutto"; return; }
  ans = []; salva(); conferma = false; e.currentTarget.textContent = "Ricomincia da capo";
  document.getElementById("foglio").hidden = true; ultimo = 0; disegna();
};
disegna();
</script>

</html>
